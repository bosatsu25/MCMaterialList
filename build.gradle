plugins {
    id 'base'
}
allprojects {
    group = 'dev.mcmateriallist'
    version = rootProject.mod_version
}
subprojects {
    apply plugin: 'java-library'
    repositories { mavenCentral() }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs += ['-Xlint:all']
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.14.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
tasks.named('build') { dependsOn ':core:build', ':fabric:build' }
tasks.named('clean') { dependsOn ':core:clean', ':fabric:clean' }
tasks.register('test') { dependsOn ':core:test', ':fabric:test' }
tasks.register('verifyPhase0') {
    group = 'verification'
    description = 'Build, test two real client processes, and boot an isolated dedicated server.'
    dependsOn 'build', ':fabric:verifyClientRestart', ':fabric:verifyServerSmoke'
}
tasks.register('verifyPhase1') {
    group = 'verification'
    description = 'Run core work/persistence tests and Phase 0 + Phase 1 in two real client processes and an isolated server.'
    dependsOn 'verifyPhase0'
}
tasks.register('verifyPhase2') {
    group = 'verification'
    description = 'Run Phase 0/1 regressions, durable material and region UI interactions and fresh-process restoration, plus server isolation.'
    dependsOn 'verifyPhase1'
}
tasks.register('verifyPhase3') {
    group = 'verification'
    description = 'Run all retained local/restart/server gates, shared socket transport, native shared UI integration, and two real clients against a restarted dedicated server.'
    dependsOn 'verifyPhase2', ':fabric:verifySharedTransport', ':fabric:runSharedUiTest', ':fabric:verifyMultiplayer'
}
tasks.register('verifyPhase4') {
    group = 'verification'
    description = 'Run every retained Phase 0-3 gate plus Phase 4A Location Files (real UI registration, cross-dimension refusal, fresh-process persistence) and Phase 4B Check Materials (server scan, authorization, fallback, budget).'
    dependsOn 'verifyPhase3', ':fabric:verifyLocationFiles', ':fabric:verifyStockScan'
}
