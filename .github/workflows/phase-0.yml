name: Phase 0/1/2/3 regression and Phase 4A Location Files
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean build
      - name: Real client restart with Location Files, shared transport and UI, isolated dedicated server, and two-client multiplayer
        run: xvfb-run -a ./gradlew --no-daemon verifyPhase4 -PacceptMinecraftEula=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-4a-test-evidence
          path: |
            core/build/test-results/test/*.xml
            fabric/build/run/clientGameTest/screenshots/*.png
            fabric/build/phase0-fixture/phase2-region/expected-regions.json
            fabric/build/phase0-fixture/phase4/expected-location.json
            fabric/build/run/sharedUiTest/screenshots/*.png
            fabric/build/run/sharedUiTest/logs/latest.log
            fabric/build/run/sharedTransportTest/logs/latest.log
            fabric/build/run/clientGameTest/logs/latest.log
            fabric/build/run/serverSmoke/logs/latest.log
            fabric/build/run/serverSmoke/class-load.log
            fabric/build/run/multiplayer/consoles/*.log
            fabric/build/run/multiplayer/server/class-load-*.log
          if-no-files-found: ignore
