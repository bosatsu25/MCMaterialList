name: Phase 0/1/2 regression and Phase 3A shared work
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon clean build
      - name: Real client restart, shared transport and UI, and isolated dedicated server
        run: xvfb-run -a ./gradlew --no-daemon verifyPhase3 -PacceptMinecraftEula=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-3a-test-evidence
          path: |
            core/build/test-results/test/*.xml
            fabric/build/run/clientGameTest/screenshots/*.png
            fabric/build/phase0-fixture/phase2-region/expected-regions.json
            fabric/build/run/sharedUiTest/screenshots/*.png
            fabric/build/run/sharedUiTest/logs/latest.log
            fabric/build/run/sharedTransportTest/logs/latest.log
            fabric/build/run/clientGameTest/logs/latest.log
            fabric/build/run/serverSmoke/logs/latest.log
            fabric/build/run/serverSmoke/class-load.log
          if-no-files-found: ignore
