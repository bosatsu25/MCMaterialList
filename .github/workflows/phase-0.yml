name: Release gate (verifyRelease = verifyPhase4 + JAR, license and translation checks)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon --warning-mode all clean build
      # verifyRelease runs every verifyPhase4 gate (real client restart with Location Files and Check Materials, shared
      # transport and native UI, isolated dedicated server, two-client multiplayer with a restart, Unshare, Phase 5A traces)
      # plus :fabric:verifyApplicationJar, :fabric:verifyDependencyLicenses and :fabric:verifyTranslations.
      - name: Release gate (all Phase 0-4 gates, application JAR contents, dependency licenses, translations)
        run: xvfb-run -a ./gradlew --no-daemon --warning-mode all verifyRelease -PacceptMinecraftEula=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-4a-test-evidence
          path: |
            core/build/test-results/test/*.xml
            core/build/reports/jacoco/test/jacocoTestReport.xml
            core/build/reports/jacoco/test/html/**
            fabric/build/run/clientGameTest/screenshots/*.png
            fabric/build/phase0-fixture/phase2-region/expected-regions.json
            fabric/build/phase0-fixture/phase4/expected-location.json
            fabric/build/run/sharedUiTest/screenshots/*.png
            fabric/build/run/sharedUiTest/logs/latest.log
            fabric/build/run/sharedTransportTest/logs/latest.log
            fabric/build/run/clientGameTest/logs/latest.log
            fabric/build/run/serverSmoke/logs/latest.log
            fabric/build/run/serverSmoke/class-load.log
            fabric/build/run/multiplayer/consoles/*.log
            fabric/build/run/multiplayer/server/class-load-*.log
          if-no-files-found: ignore
      # The application JAR that passed verifyApplicationJar on this exact head (the sources JAR is not a distribution).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: application-jar
          path: |
            fabric/build/libs/fabric-*.jar
            !fabric/build/libs/fabric-*-sources.jar
          if-no-files-found: error
